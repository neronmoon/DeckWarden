name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Bitwarden CLI
        run: bash scripts/fetch-bw.sh

      - name: Build frontend
        run: pnpm exec rollup -c

      - name: Smoke check
        run: pnpm run check

      - name: Download Decky CLI
        run: |
          mkdir -p cli
          curl -fsSL -o cli/decky \
            https://github.com/SteamDeckHomebrew/cli/releases/latest/download/decky-linux-x86_64
          chmod +x cli/decky

      - name: Package plugin
        run: ./cli/decky plugin build "$(pwd)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeckWarden
          path: out/*.zip
          if-no-files-found: error
